onboarding = false
[keys]
prefix = "ctrl+alt+cmd+shift+a"
previous_tab = ["prefix+[", "ctrl+alt+cmd+shift+h"]
next_tab = ["prefix+]", "ctrl+alt+cmd+shift+l"]

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "switcher.open"
description = "fuzzy switch workspace, tab, or pane"

[[keys.command]]
key = "prefix+\\"
type = "plugin_action"
command = "brain.toggle"
description = "toggle opencode console in ~/brain"

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
[theme]
name = "kanagawa"
auto_switch = false

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true
